services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
      POSTGRES_DB: corpus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://corpus:corpus@db:5432/corpus
      FRONTEND_DIR: /frontend
    ports: ["8000:8000"]
    volumes: ["./frontend:/frontend"]
    depends_on: [db]
volumes:
  pgdata:
